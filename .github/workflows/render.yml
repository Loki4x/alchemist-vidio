name: Render video Alchemist

on:
  workflow_dispatch:
    inputs:
      whisper_model:
        description: "Model faster-whisper (small = cepat, medium = lebih akurat)"
        default: "medium"
      concurrency:
        description: "Jumlah tab Chrome paralel"
        default: "4"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Library sistem untuk Chrome + ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 \
            libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libcups2 libatk-bridge2.0-0

      - name: Install dependensi Node
        run: npm install || (node scripts/pin-remotion.mjs && npm install)

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Install dependensi Python
        run: pip install faster-whisper numpy scipy

      - name: Sinkronisasi suara (speech recognition → timestamp per kata)
        continue-on-error: true
        env:
          WHISPER_MODEL: ${{ github.event.inputs.whisper_model || 'medium' }}
        run: |
          python scripts/transcribe.py
          python scripts/align_script.py work/asr.json src/data/words.json

      - name: Simpan data sinkronisasi
        uses: actions/upload-artifact@v4
        with:
          name: sync-data
          path: |
            src/data/words.json
            work/asr.json
          if-no-files-found: warn

      - name: Render video
        run: npx remotion render Alchemist out/Alchemist.mp4 --codec=h264 --crf=18 --concurrency=${{ github.event.inputs.concurrency || '4' }} --log=info

      - name: Upload video (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Alchemist-video
          path: out/Alchemist.mp4
          retention-days: 14

      - name: Publish ke GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "video-${{ github.run_number }}" out/Alchemist.mp4 \
            --title "Video Alchemist #${{ github.run_number }}" \
            --notes "Render otomatis dengan Remotion (1920x1080, 60fps)."
